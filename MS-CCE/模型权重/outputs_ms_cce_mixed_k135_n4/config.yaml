model: ParaformerStreaming
model_conf:
  ctc_weight: 0.0
  lsm_weight: 0.1
  length_normalized_loss: true
  predictor_weight: 1.0
  predictor_bias: 1
  sampling_ratio: 0.75
encoder: SANMEncoderChunkOpt
encoder_conf:
  output_size: 320
  attention_heads: 4
  linear_units: 1280
  num_blocks: 40
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.1
  input_layer: pe_online
  pos_enc_class: SinusoidalPositionEncoder
  normalize_before: true
  kernel_size: 11
  sanm_shfit: 0
  selfattention_layer_type: sanm
  chunk_size:
  - 20
  stride:
  - 10
  pad_left:
  - 5
  encoder_att_look_back_factor:
  - 0
  decoder_att_look_back_factor:
  - 0
decoder: ParaformerSANMDecoder
decoder_conf:
  attention_heads: 4
  linear_units: 1280
  num_blocks: 12
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  self_attention_dropout_rate: 0.1
  src_attention_dropout_rate: 0.1
  att_layer_num: 12
  kernel_size: 11
  sanm_shfit: 5
predictor: CifPredictorV2
predictor_conf:
  idim: 320
  threshold: 1.0
  l_order: 1
  r_order: 1
  tail_threshold: 0.45
frontend: WavFrontendOnline
frontend_conf:
  fs: 16000
  window: hamming
  n_mels: 80
  frame_length: 25
  frame_shift: 10
  lfr_m: 7
  lfr_n: 4
  cmvn_file: /root/.cache/modelscope/hub/models/iic/speech_paraformer_asr_nat-zh-cn-16k-common-vocab8404-online/am.mvn
specaug: SpecAugLFR
specaug_conf:
  apply_time_warp: false
  time_warp_window: 5
  time_warp_mode: bicubic
  apply_freq_mask: true
  freq_mask_width_range:
  - 0
  - 30
  lfr_rate: 6
  num_freq_mask: 1
  apply_time_mask: true
  time_mask_width_range:
  - 0
  - 12
  num_time_mask: 1
train_conf:
  accum_grad: 1
  grad_clip: 5
  max_epoch: 20
  val_scheduler_criterion:
  - valid
  - acc
  best_model_criterion:
  - - valid
    - acc
    - max
  keep_nbest_models: 5
  log_interval: 50
  resume: true
  validate_interval: 1000
  save_checkpoint_interval: 1000
  avg_nbest_model: 5
  use_deepspeed: false
optim: adam
optim_conf:
  lr: 5.0e-05
scheduler: warmuplr
scheduler_conf:
  warmup_steps: 3000
dataset: AudioDataset
dataset_conf:
  index_ds: IndexDSJsonl
  batch_sampler: BatchSampler
  batch_type: token
  batch_size: 8000
  max_token_length: 2048
  buffer_size: 500
  shuffle: true
  num_workers: 2
  data_split_num: 1
  sort_size: 1024
tokenizer: CharTokenizer
tokenizer_conf:
  unk_symbol: <unk>
  split_with_space: true
  token_list: /root/.cache/modelscope/hub/models/iic/speech_paraformer_asr_nat-zh-cn-16k-common-vocab8404-online/tokens.json
  seg_dict_file: /root/.cache/modelscope/hub/models/iic/speech_paraformer_asr_nat-zh-cn-16k-common-vocab8404-online/seg_dict
ctc_conf:
  dropout_rate: 0.0
  ctc_type: builtin
  reduce: true
  ignore_nan_grad: true
normalize: null
init_param: /root/.cache/modelscope/hub/models/iic/speech_paraformer_asr_nat-zh-cn-16k-common-vocab8404-online/model.pt
config: /root/.cache/modelscope/hub/models/iic/speech_paraformer_asr_nat-zh-cn-16k-common-vocab8404-online/config.yaml
is_training: true
model_class: ParaformerStreamingMSCce
train_data_set_list: /home/FunASR/FunASR-main/data/mixed/train.jsonl
valid_data_set_list: /home/FunASR/FunASR-main/data/mixed/val.jsonl
use_cce: true
cce_dim: 560
cce_kernel_sizes:
- 1
- 3
- 5
cce_fixed_weight: 0.8
cce_chunk_size: 16
output_dir: /home/FunASR/FunASR-main/outputs_ms_cce_mixed_k135_n4
model_path: /root/.cache/modelscope/hub/models/iic/speech_paraformer_asr_nat-zh-cn-16k-common-vocab8404-online
device: cpu
